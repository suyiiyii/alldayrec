name: APK build

on:
  push:
    branches: [main]
    tags: ['apk-v*']
    paths:
      - 'app/**'
      - '.github/workflows/apk-build.yml'
      - '.github/scripts/apk-*'
      - '.github/scripts/prune-build-artifacts.sh'
  workflow_dispatch:

permissions:
  contents: read

# Keep tag builds intact; newer main/manual builds may supersede older ones.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/apk-v') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      commit: ${{ steps.build.outputs.commit }}
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn  # the host pubspec.lock records: --enforce-lockfile refuses another
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.13.0
      - name: Check version, main ancestry and mandatory release secrets
        # Only the two steps that read them get the signing secrets, and only on an apk-v tag push (not a
        # main/manual test build, even one dispatched at a tag).
        env: &signing
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v') && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_SIGNING_CERT_SHA256: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v') && secrets.ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: uv run --no-project --python 3.11 python .github/scripts/apk-build.py --check
      - name: Set up pinned JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Set up pinned Flutter and Android SDK
        run: bash .github/scripts/apk-toolchain.sh
      - name: Build and verify explicitly signed APK
        id: build
        env: *signing
        run: uv run --no-project --python 3.11 python .github/scripts/apk-build.py
      - name: Upload the exact APK, metadata and checksums
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/apk/*
          retention-days: 3
          if-no-files-found: error
      - name: Remove private signing files and ephemeral Gradle cache
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP"/apk-signing-*
          rm -rf "$RUNNER_TEMP"/apk-gradle-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"

  prune:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep only this branch's latest successful APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_WORKFLOW: apk-build.yml
          ARTIFACT_PREFIX: apk-
        run: bash .github/scripts/prune-build-artifacts.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apk-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Install pinned uv
        run: pipx install uv==0.13.0
      - name: Download this build's exact artifact by ID (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist/apk
      - name: Verify source binding and publish the release
        working-directory: dist/apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          uv run --no-project --python 3.11 python - <<'PY'
          import json, os, pathlib, subprocess
          metadata_files = list(pathlib.Path('.').glob('*.json'))
          if len(metadata_files) != 1:
              raise SystemExit('Expected exactly one APK metadata file')
          metadata = json.loads(metadata_files[0].read_text())
          if (metadata['source_commit'] != os.environ['SOURCE_COMMIT']
                  or metadata['release_tag'] != os.environ['RELEASE_TAG']
                  or metadata['signing'] != 'original-signed'
                  or os.environ['RELEASE_TAG'] != 'apk-v' + metadata['version_name']):
              raise SystemExit('Artifact does not match the requested original-signed release')
          # --target does not change an existing tag. Refuse a tag moved since checkout.
          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          ref = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/ref/tags/{tag}']))
          target = ref['object']
          while target['type'] == 'tag':
              target = json.loads(subprocess.check_output(['gh', 'api', f"repos/{repo}/git/tags/{target['sha']}"]))['object']
          if target['type'] != 'commit' or target['sha'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Release tag moved or no longer matches the built source commit')
          PY
          gh release create "$RELEASE_TAG" ./* --verify-tag --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --notes-file release-notes.txt
