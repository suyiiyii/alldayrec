name: server
on:
  pull_request:  # only on PRs: main gets what a green PR ran
    paths: ['server/**', '.github/workflows/server.yml']

concurrency:  # a new push to a PR cancels its run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # ~4 min on a hosted runner; one slow run went past 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, the job's only action: a runner downloads every action its job names, skipped or not
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # the tests encode Opus and AAC pieces
      - run: pipx install uv  # into /opt/pipx_bin, on the image's PATH
      - run: uv sync --locked  # uv.lock as it is, as deploy.sh installs it on the deploy host (uv sync --frozen)
      - run: uv run --with pytest pytest -q
