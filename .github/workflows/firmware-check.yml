name: firmware-check
on:
  pull_request:  # only on PRs: main gets what a green PR ran
    paths: ['firmware/devkit/**', 'fixtures/**', '.github/workflows/firmware-check.yml']

concurrency:  # a new push to a PR cancels its run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# host checks of the firmware's logic only; the boards' builds (lr.sh build) are made and flashed where they are tested
jobs:
  firmware-check:  # the record stream and its timing events (test/store_check.c), and lr_sync.py's decoding of them
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: firmware/devkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, the job's only action: a runner downloads every action its job names, skipped or not
      - run: |  # the Zephyr headers lr_store.c includes, empty: the check defines what it uses
          d=$(mktemp -d) && mkdir -p $d/zephyr/{bluetooth,fs,sys,logging,drivers,random}
          for h in bluetooth/conn bluetooth/gatt bluetooth/uuid fs/fs kernel logging/log sys/byteorder sys/ring_buffer drivers/sensor random/random drivers/sdhc drivers/gpio drivers/spi sys/crc; do touch $d/zephyr/$h.h; done
          cc -O1 -w -I$d -o $d/store_check test/store_check.c && $d/store_check
          cc -w -I$d -o $d/sdhc_check test/sdhc_check.c && $d/sdhc_check  # the SD card's SPI waits (src/sdhc_spi.c)
          cc -o $d/led_check test/led_check.c && $d/led_check  # the one-LED boards' flash codes (src/led_code.h)
          cc -o $d/power_check test/power_check.c && $d/power_check  # when a low battery turns it off (src/lr_power.h)
          cc -o $d/switch_check test/switch_check.c && $d/switch_check  # LR-P3's switch debounce (src/lr_switch.h)
          cc -o $d/health_check test/health_check.c && $d/health_check  # the mic's HEALTH counts (src/mic_health.h)
          cc -o $d/mic_ring_check test/mic_ring_check.c && $d/mic_ring_check  # the mic's buffers left out are a gap in the frame numbers (src/mic_ring.h)
          cc -o $d/hpf_check test/hpf_check.c -lm && $d/hpf_check  # high-pass filter response and state (src/hpf.h)
      - run: pipx install uv  # into /opt/pipx_bin, on the image's PATH
      - run: uv run --no-project --with bleak python lr_sync.py --selftest  # the record stream, event log and Ogg as lr_sync.py reads them
