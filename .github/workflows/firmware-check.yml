name: firmware-check
on:
  pull_request:  # only on PRs: main gets what a green PR ran
    paths: ['firmware/devkit/**', 'firmware/selftest/**', 'fixtures/**', '.github/workflows/firmware-check.yml', '.github/scripts/firmware-setup-ncs.sh']

concurrency:  # a new push to a PR cancels its run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# host checks of the firmware's logic, and builds of the NAND boards; the released boards are built on main
# (firmware-build.yml) and flashed where they are tested
jobs:
  firmware-check:  # the record stream and its timing events (test/store_check.c), and lr_sync.py's decoding of them
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: firmware/devkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, the job's only action: a runner downloads every action its job names, skipped or not
      - run: |  # the Zephyr headers lr_store.c includes, empty: the check defines what it uses
          d=$(mktemp -d) && mkdir -p $d/zephyr/{bluetooth,fs,sys,logging,drivers,random}
          for h in bluetooth/conn bluetooth/gatt bluetooth/uuid fs/fs kernel logging/log sys/byteorder sys/ring_buffer drivers/sensor random/random drivers/sdhc drivers/gpio drivers/spi sys/crc; do touch $d/zephyr/$h.h; done
          for o in "" -DPHONE=0 -DCARD_OFF=0; do cc -O1 -w $o -I$d -o $d/store_check test/store_check.c && $d/store_check || exit 1; done  # LR-P3, the other boards, LR-P3 with the card left on
          cc -w -I$d -o $d/sdhc_check test/sdhc_check.c && $d/sdhc_check  # the SD card's SPI waits (src/sdhc_spi.c)
          cc -O1 -o $d/nand_check test/nand_check.c && $d/nand_check  # the NAND ring log: wrap, bad blocks, ECC, power cut at every op (src/nand_log.c)
          mkdir -p $d/zephyr/storage $d/hal && touch $d/zephyr/fs/fcb.h $d/zephyr/storage/flash_map.h $d/hal/nrf_power.h $d/mpsl_temp.h
          cc -w -I$d -o $d/log_check test/log_check.c && $d/log_check  # a second's DROPPED gaps are one record (src/lr_log.c)
          mkdir -p $d/zephyr/storage $d/zephyr/usb/class $d/hal && touch $d/zephyr/drivers/disk.h $d/zephyr/drivers/uart.h $d/zephyr/storage/disk_access.h $d/zephyr/usb/class/usbd_msc.h $d/zephyr/usb/usbd.h $d/zephyr/sys/iterable_sections.h $d/hal/nrf_power.h
          cc -w -I$d -o $d/usb_check test/usb_check.c && $d/usb_check  # only a lent card's reads and writes that work keep it lent (src/usb.c)
          cc -o $d/led_check test/led_check.c && $d/led_check  # the one-LED boards' flash codes (src/led_code.h)
          cc -o $d/power_check test/power_check.c && $d/power_check  # when a low battery turns it off (src/lr_power.h)
          cc -o $d/switch_check test/switch_check.c && $d/switch_check  # LR-P3's switch debounce (src/lr_switch.h)
          cc -o $d/card_check test/card_check.c && $d/card_check  # a card that does not mount: blank or a volume all the same (src/card_marks.h)
          cc -o $d/health_check test/health_check.c && $d/health_check  # the mic's HEALTH counts (src/mic_health.h)
          cc -o $d/mic_ring_check test/mic_ring_check.c && $d/mic_ring_check  # the mic's buffers left out are a gap in the frame numbers (src/mic_ring.h)
          cc -o $d/hpf_check test/hpf_check.c -lm && $d/hpf_check  # high-pass filter response and state (src/hpf.h)
          cc -Wall -o $d/buzzer_check test/buzzer_check.c && $d/buzzer_check  # LR-N5-S's buzzer: <= 20 ms a segment, <= 25 % (src/buzzer_seq.h)
          mkdir -p $d/zephyr/settings $d/zephyr/drivers/clock_control $d/haly && touch $d/zephyr/settings/settings.h $d/zephyr/devicetree.h $d/hal/nrf_pdm.h $d/haly/nrfy_gpio.h
          touch $d/zephyr/device.h $d/zephyr/drivers/gpio.h $d/zephyr/drivers/clock_control/nrf_clock_control.h $d/nrfx_pdm.h
          cc -w -pthread -I$d -o $d/gain_check test/gain_check.c && $d/gain_check  # the mic's gain: at once, NVS after, a bad record, a GAIN during PDM init (src/mic_gain.c, src/mic.c)
          cc -w -I$d -o $d/raw_pcm_check test/raw_pcm_check.c && $d/raw_pcm_check  # E1's raw PCM: frames the mic ring or the host queue lost are a gap in seq (src/raw_pcm.c)
      - run: |  # DCDC is Kconfig's alone (SOC_DCDC_NRF52X*, lr_release.py's FIT): no code writes DCDCEN or DCDCEN0
          if git grep -n -i dcdcen -- '*.c' '*.h'; then echo "::error::set DCDC in Kconfig, not in code"; exit 1; fi
      - run: pipx install uv  # into /opt/pipx_bin, on the image's PATH
      - run: uv run --no-project --with bleak python lr_sync.py --selftest  # the record stream, event log and Ogg as lr_sync.py reads them
      - run: python3 lr_pcm.py --selftest  # E1's raw PCM frames (src/raw_pcm.c) and its before / after verdict
      - run: python3 ../selftest/selftest.py check && uv run ../selftest/swd.py test  # the self-test's verdicts, LR-N5's SWD flash / diag and UICR file

  # n5 and promicro-nand compile (lr.sh build), LR-N5's self-test, and the raw-PCM test builds (LR_RAW_PCM=1, kept as
  # artifacts to flash for a lab test): not released, so a PR is where a broken one shows. The released boards too, for
  # their DCDC and switch settings: LR-N4's as its boards were built (lr_release.py's FIT), every other one's DCDC on
  nand-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [n5, n5s, promicro-nand, selftest-n5, promicro-p3-rawpcm, n4-rawpcm, sdmod, expansion, promicro, promicro-p2,
                  promicro-p3, n4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install uv==0.13.0
      # not cached: the SDK and toolchain are 8 GB as a cache (10 GB for the whole repo), and save ~3 of ~6 minutes
      - name: Set up official native toolchain and full SDK
        id: setup
        run: bash .github/scripts/firmware-setup-ncs.sh
      - name: Build
        env:
          FIRMWARE_ENV_FILE: ${{ steps.setup.outputs.env_file }}
          VARIANT: ${{ matrix.variant }}
        run: |
          source "$FIRMWARE_ENV_FILE"
          if [ "$VARIANT" = selftest-n5 ]; then  # as firmware-build.sh builds the released (ProMicro) self-test
            nrfutil sdk-manager toolchain launch --ncs-version v2.7.0 --install-dir "$LR_NCS_INSTALL_DIR" --chdir "$NCS" -- \
              west build -b xiao_ble/nrf52840 -d "$GITHUB_WORKSPACE/firmware/selftest/build-n5" \
              "$GITHUB_WORKSPACE/firmware/selftest" -o=-j4 -- -DNCS_TOOLCHAIN_VERSION=NONE \
              "-DDTC_OVERLAY_FILE=$GITHUB_WORKSPACE/firmware/selftest/promicro.overlay" -DLR_N5=1
          elif [ "${VARIANT%-rawpcm}" != "$VARIANT" ]; then
            LR_RAW_PCM=1 LR_BUILD_JOBS=4 bash firmware/devkit/lr.sh build "${VARIANT%-rawpcm}"
          else
            LR_BUILD_JOBS=4 bash firmware/devkit/lr.sh build "$VARIANT"
          fi
      - name: DCDC and switch settings
        if: matrix.variant != 'selftest-n5'
        working-directory: firmware/devkit
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          c=build/lr-$VARIANT/zephyr/.config
          grep -E '^(# )?CONFIG_(SOC_DCDC_NRF52X(_HV)?|LR_SWITCH(_OPEN_ON)?|LR_MIC_GAIN)[= ]' "$c"
          if [ "${VARIANT%-rawpcm}" = n4 ]; then  # what lr_release.py checks before an LR-N4 upload
            python3 -c 'import lr_release, sys; sys.exit(lr_release.unfit("n4", open(sys.argv[1]).read()) or None)' "$c"
          elif [ "$VARIANT" = n5s ]; then  # LR-N5-S's first boards: LDOs, its own switch ball, the buzzer silent by default
            if grep -qE '^CONFIG_SOC_DCDC_NRF52X(_HV)?=y' "$c"; then exit 1; fi
            grep -qx CONFIG_LR_BUZZER=y "$c"
            grep -qx CONFIG_LR_BUZZER_DUTY_MAX=0 "$c"
            grep -qx 'CONFIG_BT_DIS_MODEL="LR-N5S"' "$c"
          else  # DCDC on as before (main.c set DCDCEN and DCDCEN0 on every board till the SoC's init alone did), and
            # an LR-N4 check that refuses this build; one command a line: bash -e ignores a failure before && or after !
            grep -qx CONFIG_SOC_DCDC_NRF52X=y "$c"
            grep -qx CONFIG_SOC_DCDC_NRF52X_HV=y "$c"
            grep -qx CONFIG_LR_MIC_GAIN=0x28 "$c"
            if grep -q '^CONFIG_LR_SWITCH_OPEN_ON=y' "$c"; then exit 1; fi
            python3 -c 'import lr_release, sys; assert lr_release.unfit("n4", open(sys.argv[1]).read())' "$c"
          fi
      - name: The boards selftest.py flash gives this build to
        if: "!endsWith(matrix.variant, '-rawpcm')"
        env:
          VARIANT: ${{ matrix.variant }}
        run: |  # only its own board (the XIAO's: none), read from the real build; an LR-N5 without L1 never a DCDC build
          f=firmware/devkit/build/lr-$VARIANT/zephyr/zephyr.uf2
          [ "$VARIANT" != selftest-n5 ] || f=firmware/selftest/build-n5/zephyr/zephyr.uf2
          python3 - "$f" "$VARIANT" <<'EOF'
          import sys; sys.path.insert(0, "firmware/selftest"); import selftest as s
          f, v = sys.argv[1:]
          want = {"selftest-n5": "n5", "n5": "n5", "n5s": "n5s", "n4": "n4"}.get(v, None if v in ("sdmod", "expansion") else "promicro")
          takes = {b for b in s.MODELS for fitted in (True, None) if s.image_problem(b, f, fitted) is None}
          assert takes == ({want} if want else set()), (v, takes)
          no_l1 = s.image_problem("n5", f, False) if want == "n5" else None
          assert not s.image(f)[2] or "inductor" in no_l1 if want == "n5" else True, (v, no_l1)  # DCDC build: refused
          print(v, "->", takes or "no board", "| LR-N5 without L1:", no_l1 or "ok")
          EOF
      - if: endsWith(matrix.variant, '-rawpcm')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-test-${{ matrix.variant }}-${{ github.event.pull_request.head.sha }}
          path: |  # with its .config and CMakeCache.txt, which selftest.py flash --uf2 reads to know what it is for
            firmware/devkit/build/lr-${{ matrix.variant }}/zephyr/zephyr.uf2
            firmware/devkit/build/lr-${{ matrix.variant }}/zephyr/.config
            firmware/devkit/build/lr-${{ matrix.variant }}/CMakeCache.txt
          retention-days: 14
          include-hidden-files: true  # .config: upload-artifact skips dot files by default
          if-no-files-found: error
