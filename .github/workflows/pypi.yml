name: pypi
on:
  push:
    tags: ['v*']  # v1.2.3 -> alldayrec 1.2.3 on PyPI: server/pyproject.toml's version must be 1.2.3

permissions:
  contents: read

# The wheel (the server with the web app built into it) and the sdist, published with PyPI's trusted publishing: no
# token anywhere. PyPI trusts this workflow (pypi.yml) in the environment pypi of suyiiyii/alldayrec; only the publish
# job can mint the OIDC token PyPI takes, and it runs no build tool.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |  # a tag without the version bump would upload the old version again (refused) or a wrong one
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/pyproject.toml)
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME, server/pyproject.toml $v: bump it first"; exit 1; }
      - run: npm install -g pnpm@12.8.1  # web/package.json's devEngines; the image's Node is 22
      - run: pnpm install --frozen-lockfile && pnpm build  # -> server/alldayrec/static/dist, packed into the wheel
        working-directory: web
      - run: git rev-parse --short HEAD > server/alldayrec/COMMIT  # the version the pages show (no git where it runs)
      - run: pipx install uv  # into /opt/pipx_bin, on the image's PATH
      - run: uv build
        working-directory: server
      - run: uvx twine check dist/*  # reject an invalid PyPI description before uploading
        working-directory: server
      - run: |  # the pages and COMMIT in the wheel, or fail
          files=$(unzip -l dist/alldayrec-*.whl)
          grep -q 'alldayrec/static/dist/index\.html$' <<< "$files" && grep -q 'alldayrec/COMMIT$' <<< "$files"
        working-directory: server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: server/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/alldayrec
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
