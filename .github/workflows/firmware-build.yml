name: firmware-build

on:
  push:
    branches: [main]
    tags: ['firmware-*']
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
      - '.github/scripts/firmware-*'
      - '.github/scripts/test_firmware_select.py'
      - '.github/scripts/prune-build-artifacts.sh'
  workflow_dispatch:
    inputs:
      target:
        description: Firmware family (manual builds never release)
        type: choice
        options: [all, devkit, selftest, blerelay]
        default: all
      variant:
        description: Recorder variant (all excludes experimental expansion)
        type: choice
        options: [all, sdmod, promicro, promicro-p2, promicro-p3, expansion]
        default: all

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # this branch's last successful run
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.13.0
      - name: Check firmware selection boundaries
        run: uv run --no-project --python 3.11 python .github/scripts/test_firmware_select.py
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # empty when the lookup fails: then every family is built
          LAST_SUCCESS_SHA=$(gh api "repos/$GH_REPO/actions/workflows/firmware-build.yml/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
          export LAST_SUCCESS_SHA
          uv run --no-project --python 3.11 python .github/scripts/firmware-select.py

  build:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAKEFLAGS: '-j2'
      NINJAFLAGS: '-j2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lr.sh uses commit history to generate firmware revision
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.13.0
      - name: Set up official native toolchain and full SDK
        id: setup
        env:
          SDK: ${{ matrix.sdk }}
        run: bash ".github/scripts/firmware-setup-$SDK.sh"
      - name: Build and package without flashing or deploying
        env:
          FIRMWARE_ENV_FILE: ${{ steps.setup.outputs.env_file }}
          FIRMWARE_FAMILY: ${{ matrix.family }}
          FIRMWARE_VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/firmware-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.family }}-${{ matrix.variant }}-${{ github.sha }}
          path: firmware-artifacts/*
          retention-days: 3
          if-no-files-found: error
          # A rerun replaces only this run's artifact for the same model/commit.
          overwrite: true

  prune:
    needs: [select, build]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep only this branch's latest successful firmware artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_WORKFLOW: firmware-build.yml
          ARTIFACT_PREFIX: firmware-
        run: bash .github/scripts/prune-build-artifacts.sh

  release:
    needs: [select, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/firmware-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.13.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-*-${{ github.sha }}
          path: firmware-artifacts
          merge-multiple: true
      - name: Create owner-reviewed draft from the exact uploaded bits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/firmware-release.sh
