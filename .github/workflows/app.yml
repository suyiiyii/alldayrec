name: app
on:
  pull_request:  # only on PRs: main gets what a green PR ran
    paths: ['app/**', 'fixtures/**', '.github/workflows/app.yml', '.github/scripts/apk-toolchain.sh']

concurrency:  # a new push to a PR cancels its run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # hosted Android SDK/Gradle downloads can make a cold run slower
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pipx install uv
      # JDK, Flutter and Gradle come from GitHub releases, which can answer 504 for minutes. apk-build.yml saves these
      # caches on main (and never reads them); a PR restores main's, or its own from an earlier run.
      - name: Restore pinned JDK into the tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Java_Temurin-Hotspot_jdk/17.0.18-8
          key: jdk-temurin-17.0.18+8-${{ runner.os }}-${{ runner.arch }}
      - name: Set up pinned JDK without sudo
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1, into the runner's own tool cache
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Restore pinned Flutter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/apk-flutter
          key: flutter-3.47.5-6a19cca56475dbfba1478ee68d7bd0c2ef891da1-android-${{ runner.os }}-${{ runner.arch }}
      - name: Restore Gradle wrapper and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock', '.github/scripts/apk-toolchain.sh') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Set up pinned Flutter and runner-owned Android SDK
        run: bash ../.github/scripts/apk-toolchain.sh
      - run: flutter analyze
      - run: flutter test -j 4  # test/: the add-recorder list's order (mergeNearby)
      # the iPhone's BLE record stream (Store.swift: mirror, 'T' dating, Ogg), event log (DeviceLog.swift), firmware update
      # checks (Dfu.swift) and listening (Listen.swift): Foundation only
      - run: swiftc -o "$RUNNER_TEMP/storecheck" ios/Runner/Store.swift ios/Runner/DeviceLog.swift ios/Runner/Dfu.swift ios/Runner/Listen.swift "$PWD/ios/StoreCheck/main.swift" && "$RUNNER_TEMP/storecheck"  # absolute main.swift lets #filePath locate the shared fixture; RUNNER_TEMP avoids shared /tmp
      - name: Android JVM regression tests (no APK or signing)
        working-directory: app/android
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > local.properties
          # Flutter normally installs these during an APK build; this gate builds no APK.
          cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew" .
          cp "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --no-parallel \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m' \
            -Dorg.gradle.vfs.watch=false -Pkotlin.compiler.execution.strategy=in-process

  # the iPhone's Feishu recorder bean (Bean.swift: frames, crypto vectors, BeanSync against a fake bean): CryptoKit and
  # CommonCrypto exist on macOS only
  bean-check:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swiftc -o "$RUNNER_TEMP/beancheck" ios/Runner/Bean.swift ios/Runner/Store.swift "$PWD/ios/BeanCheck/main.swift" && "$RUNNER_TEMP/beancheck"
