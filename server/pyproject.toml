[project]
name = "alldayrec"
version = "0.2.0"
description = "alldayrec server: a continuous audio stream in, conversations out — local VAD + cloud or local ASR + web page"
requires-python = ">=3.11,<3.15"  # onnxruntime has no 3.15 wheel yet
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=1.26",
    "kaldi-native-fbank==1.22.3",
    "onnxruntime==1.30.0",
    "websockets>=17.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "httpx2>=2.13.1",
    "anyio>=4.15.1",
]

[project.optional-dependencies]
# ENGINE=local (local_asr.py; 1.13.8 garbled some models' output), owner.py, replay_case.py: pip install 'alldayrec[local]'
local = ["sherpa-onnx>=2.0.0", "sherpa-onnx-core>=2.0.0"]

[project.scripts]
alldayrec = "alldayrec.server:main"  # as python -m alldayrec

[project.urls]
Homepage = "https://github.com/suyiiyii/alldayrec"
Documentation = "https://suyiiyii.github.io/alldayrec/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["alldayrec/static/dist/"]  # the web app, built into it before uv build (gitignored, so named here)

[dependency-groups]
export = ["torch==2.14.1", "torchaudio==2.11.0", "onnx==1.22.0"]  # export_onnx.py only: the server runs the models on onnxruntime

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]  # the export runs on CPU; the PyPI Linux wheel drags in 2 GB of CUDA
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]  # ReDimNet2's feature layer
