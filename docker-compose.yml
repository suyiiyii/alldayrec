# The server in Docker, on port 8770 of every interface of this machine: phones connect to http://<its LAN or Tailscale IP>:8770.
#   cp .env.example .env    # fill in: ENGINE=qwen needs DASHSCOPE_API_KEY and the LLM_* settings
#   mkdir -p data && echo '[{"id": "main", "token": "'$(openssl rand -hex 16)'", "data": "/data/main", "recordings": "/data/main/recordings"}]' > data/tenants.json && chmod 600 data/tenants.json
#   docker compose up -d && docker compose logs -f    # then open http://<this machine's LAN or Tailscale IP>:8770/?token=<the token>
# ./data holds tenants.json, the model files (downloaded into data/models at the first start, sha256-checked) and each
# tenant's store and recordings. .env: comments on their own lines (Compose reads "VAR=   # comment" as the value).
services:
  alldayrec:
    image: ghcr.io/suyiiyii/alldayrec:latest  # linux/amd64 and linux/arm64, from .github/workflows/docker.yml
    # build: .  # to build it here from this checkout instead: uncomment, then docker compose up -d --build
    env_file: .env
    environment:  # inside the container, whatever .env says
      HOST: 0.0.0.0
      PORT: "8770"
      MODELS_DIR: /data/models
    volumes:
      - ./data:/data
    ports:
      # every interface, so phones reach it. The token in data/tenants.json is the only lock: the one you wrote there
      # (the openssl line above; nothing generates it), and with HOST 0.0.0.0 the server won't start with an empty one.
      # From the public internet: put a TLS reverse proxy in front. This machine only: "127.0.0.1:8770:8770"
      - "8770:8770"
    restart: unless-stopped
    healthcheck:  # GET /api/health needs no token; no proxy for it (.env's HTTP_PROXY is the server's)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8770/api/health', timeout=5)"]
      interval: 30s
      start_period: 60s  # the first start downloads the model files before it listens
